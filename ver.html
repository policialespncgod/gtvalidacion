<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Antecedentes Policiales</title>
    <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #073064;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-x: hidden;
        }
        #particles-js {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            background: radial-gradient(circle, #0c3d75 0%, #07224f 100%);
        }
        .main-wrapper {
            position: relative;
            z-index: 10;
            max-width: 500px;
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            box-sizing: border-box;
        }
        .pnc-header {
            background-color: #0288d1;
            padding: 20px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            position: relative;
        }
        .pnc-header h5 {
            margin: 5px 0;
            color: #ffffff;
            font-size: 1.2rem;
            font-weight: 500;
        }
        .new-badge {
            display: inline-block;
            padding: 5px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            border-radius: 4px;
            margin-top: 10px;
            background: linear-gradient(to right, #d22d5d, #c5003a);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }
        .document-container {
            background: white;
            padding: 20px;
            border-radius: 0 0 8px 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            box-sizing: border-box;
            transition: filter 0.3s ease;
        }
        .document-container img.main-img {
            max-width: 100%;
            max-height: 55vh;
            border-radius: 4px;
            object-fit: contain;
            display: none;
        }
        .action-btn {
            display: none;
            color: white;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.25s ease;
            letter-spacing: 0.5px;
            text-align: center;
            margin-top: 25px;
        }
        .action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }
        .overlay-captcha {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .captcha-box {
            background: white;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            overflow: hidden;
            box-sizing: border-box;
            animation: modalEntrada 0.4s ease-out;
        }
        @keyframes modalEntrada {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-blue-title {
            background-color: #1565c0;
            color: white;
            padding: 15px;
            text-align: center;
        }
        .modal-blue-title h5 {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 500;
        }
        .modal-body-content {
            padding: 25px 20px;
            text-align: center;
        }
        .captcha-btn-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            align-items: center;
        }
        .btn-captcha {
            width: 85%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .btn-no { background-color: #9e9e9e; color: white; }
        .btn-no:hover { background-color: #757575; }
        .btn-si { background-color: #ff9800; color: white; }
        .btn-si:hover { background-color: #f57c00; }
        .card-error {
            display: none;
            background: linear-gradient(to right, #23b9f5, #00599f);
            color: white;
            padding: 15px;
            border-radius: 4px;
            margin-top: 15px;
            text-align: left;
            border-left: 5px solid #ff9800;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .card-error h4 { margin: 0 0 5px 0; font-size: 1.1rem; }
        .card-error p { margin: 0; font-size: 0.95rem; opacity: 0.9; }
        #errorMsg { color: #e74c3c; font-weight: bold; display: none; padding: 20px; }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div class="main-wrapper">
    <section class="pnc-header">
        <h5>Validación del</h5>
        <h5>Antecedente Policial</h5>
        <span class="new-badge" id="validacioness">Documento sin validar</span>
    </section>

    <div id="mainContainer" class="document-container">
        <div id="errorMsg">❌ No se encontró la información o imagen solicitada.</div>
        <div id="cardNoValidado" class="card-error">
            <h4>Documento sin validar</h4>
            <p>Has seleccionado no validar el documento.</p>
        </div>
        <img id="mainImage" class="main-img" src="" alt="Antecedente">
        <a id="redirectBtn" class="action-btn" href="#" target="_blank">🔗 Ver más información</a>
    </div>
</div>

<div id="captchaOverlay" class="overlay-captcha">
    <div class="captcha-box" id="captchaBox">
        <div class="modal-blue-title">
            <h5>¿Desea validar el antecedente policial?</h5>
        </div>
        <div class="modal-body-content">
            <div class="captcha-btn-container">
                <button class="btn-captcha btn-no" onclick="procesarRespuesta(false)">No</button>
                <button class="btn-captcha btn-si" onclick="procesarRespuesta(true)">Si</button>
            </div>
        </div>
    </div>
</div>

<script>
    let datosFotoGlobal = {};
    let baseUrlGlobal = "";

    async function initViewer() {
        const urlParams = new URLSearchParams(window.location.search);
        const fotoName = urlParams.get('foto');
        
        const errorMsg = document.getElementById('errorMsg');
        const mainImage = document.getElementById('mainImage');
        const captchaOverlay = document.getElementById('captchaOverlay');
        const mainContainer = document.getElementById('mainContainer');

        if (!fotoName) {
            errorMsg.style.display = 'block';
            return;
        }

        const repoPath = window.location.pathname.replace('ver.html', '');
        const baseUrl = `${window.location.protocol}//${window.location.host}${repoPath}`;
        baseUrlGlobal = baseUrl;

        try {
            const response = await fetch('config.json?v=' + new Date().getTime());
            const config = await response.json();
            
            if (config[fotoName]) {
                const datosFoto = config[fotoName];
                datosFotoGlobal = datosFoto;
                mainImage.src = baseUrl + datosFoto.archivo;
                
                if (datosFoto.filtro_botones && datosFoto.filtro_botones.trim().toLowerCase() === "si") {
                    mainContainer.style.filter = "blur(3px)";
                    captchaOverlay.style.display = "flex";
                } else {
                    revelarImagenReal();
                }
            } else {
                errorMsg.style.display = 'block';
            }
        } catch (e) {
            errorMsg.style.display = 'block';
            console.error(e);
        }
    }

    function procesarRespuesta(acepto) {
        const captchaOverlay = document.getElementById('captchaOverlay');
        const mainContainer = document.getElementById('mainContainer');
        const badgeStatus = document.getElementById('validacioness');
        const cardError = document.getElementById('cardNoValidado');
        const mainImage = document.getElementById('mainImage');

        if (acepto) {
            captchaOverlay.style.display = "none";
            mainContainer.style.filter = "none";
            badgeStatus.style.background = "linear-gradient(to right, #43a047, #2e7d32)";
            badgeStatus.innerHTML = "✓ Documento Validado Exitosamente";
            revelarImagenReal();
        } else {
            captchaOverlay.style.display = "none";
            mainContainer.style.filter = "none";
            mainImage.style.display = "none";
            cardError.style.display = "block";
        }
    }

    function revelarImagenReal() {
        const mainImage = document.getElementById('mainImage');
        const redirectBtn = document.getElementById('redirectBtn');
        mainImage.style.display = 'block';
        
        if (datosFotoGlobal.destino && datosFotoGlobal.destino.trim() !== "") {
            redirectBtn.href = datosFotoGlobal.destino;
            if (datosFotoGlobal.texto && datosFotoGlobal.texto.trim() !== "") {
                redirectBtn.innerHTML = datosFotoGlobal.texto;
            }
            if (datosFotoGlobal.estilo && datosFotoGlobal.estilo.trim() !== "") {
                redirectBtn.style.cssText = datosFotoGlobal.estilo + "; margin-top: 25px; display: inline-flex;";
            } else {
