<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Servidor de Imágenes y QR</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; background-color: #f4f7f6; padding: 0 20px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        #searchBar { width: 100%; max-width: 400px; padding: 12px; font-size: 16px; border: 2px solid #bdc3c7; border-radius: 6px; margin-bottom: 30px; box-sizing: border-box; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card img { max-width: 100%; height: 140px; object-fit: cover; border-radius: 6px; }
        .card h4 { margin: 10px 0 5px 0; font-size: 14px; color: #333; word-break: break-all; }
        .copy-btn { background-color: #2980b9; color: white; border: none; padding: 8px 12px; font-size: 13px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 5px; }
        .copy-btn:hover { background-color: #21618c; }
    </style>
</head>
<body>

<div class="container">
    <h2>📂 Mi Galería Privada de Imágenes</h2>
    <p>Busca tus fotos cargadas y copia el enlace directo para tus códigos QR.</p>
    
    <input type="text" id="searchBar" placeholder="🔍 Buscar imagen por nombre..." onkeyup="filterImages()">
    
    <div class="gallery" id="imageGallery"></div>
</div>

<script>
    let imageData = {};
    const repoPath = window.location.pathname.replace('index.html', '');
    const baseUrl = `${window.location.protocol}//${window.location.host}${repoPath}`;

    async function loadGallery() {
        try {
            const response = await fetch('config.json?v=' + new Date().getTime());
            imageData = await response.json();
            renderGallery(imageData);
        } catch (e) {
            document.getElementById('imageGallery').innerHTML = "<p>⚠️ Configuración inicial: Revisa el archivo config.json.</p>";
        }
    }

    function renderGallery(data) {
        const gallery = document.getElementById('imageGallery');
        gallery.innerHTML = "";
        
        Object.keys(data).forEach(fotoName => {
            const card = document.createElement('div');
            card.className = "card";
            card.setAttribute('data-name', fotoName.toLowerCase());
            
            const imgUrl = `${baseUrl}${data[fotoName].archivo}`; 
            const finalQrLink = `${baseUrl}ver.html?foto=${fotoName}`;

            card.innerHTML = `
                <img src="${imgUrl}" onerror="this.style.display='none'" alt="${fotoName}">
                <h4>${fotoName}</h4>
                <button class="copy-btn" onclick="copyLink('${finalQrLink}')">📋 Copiar Link QR</button>
            `;
            gallery.appendChild(card);
        });
    }

    function filterImages() {
        const query = document.getElementById('searchBar').value.toLowerCase();
        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
            const name = card.getAttribute('data-name');
            card.style.display = name.includes(query) ? "block" : "none";
        });
    }

    function copyLink(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("¡Enlace copiado con éxito! Ya puedes pegarlo para hacer tu código QR.");
        }).catch(err => {
            prompt("Copia este enlace manualmente:", text);
        });
    }

    window.onload = loadGallery;
</script>

</body>
</html>
